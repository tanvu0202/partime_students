spring.application.name=backend
server.port=8080

# ---------- MySQL (database parttime_db tạo bằng docs/create_db.sql + docs/parttime_db_schema.sql) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/parttime_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=gr7
spring.datasource.password=Gr7@12345

# Bảng do script SQL tạo -> Hibernate KHÔNG tự sửa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Chuỗi bí mật >= 32 ký tự. Mỗi nhóm/máy chủ thật nên đổi chuỗi khác.
app.jwt.secret=GR7-parttime-sv-chuoi-bi-mat-dai-it-nhat-32-ky-tu
app.jwt.expiration-minutes=1440

# ---------- CORS: địa chỉ frontend React (Vite) ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- Upload CV ----------
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Dữ liệu mẫu: tự tạo khi bảng users trống ----------
app.seed.enabled=true
