spring.application.name=backend
server.port=${PORT:8080}

# ---------- MySQL (database parttime_db tạo bằng docs/create_db.sql + docs/parttime_db_schema.sql) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/parttimesv?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gr7}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Gr7@123456}

# Bảng do script SQL tạo -> Hibernate KHÔNG tự sửa bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Chuỗi bí mật >= 32 ký tự. Mỗi nhóm/máy chủ thật nên đổi chuỗi khác.
app.jwt.secret=GR7-parttime-sv-chuoi-bi-mat-dai-it-nhat-32-ky-tu
app.jwt.expiration-minutes=1440

# ---------- CORS: địa chỉ frontend React (Vite) ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- Upload CV ----------
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Dữ liệu mẫu: tự tạo khi bảng users trống ----------
app.seed.enabled=true

# ---------- Đăng nhập Google (PB-17) ----------
# Client ID loại "Web application" tạo ở Google Cloud Console; frontend dùng cùng giá trị (VITE_GOOGLE_CLIENT_ID).
# Không ghi thẳng vào đây: đặt biến môi trường GOOGLE_CLIENT_ID trước khi chạy backend.
app.google.client-id=${GOOGLE_CLIENT_ID:187257209083-fo1ssjrgtj9rs6abfuac04fcdhp35a65.apps.googleusercontent.com}
app.facebook.app-id=${FACEBOOK_APP_ID:2171977353398260}
app.facebook.app-secret=${FACEBOOK_APP_SECRET:}

# ---------- Email (PB-19 quên mật khẩu, PB-22 báo trạng thái đơn) ----------
# Không ghi mật khẩu SMTP vào đây. Đặt biến môi trường trước khi chạy backend, ví dụ với Gmail:
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=<gmail của nhóm>  SPRING_MAIL_PASSWORD=<mật khẩu ứng dụng 16 ký tự>
# Chưa đặt SPRING_MAIL_HOST thì email chỉ được ghi ra log (đủ để chạy thử, lấy đường dẫn đặt lại mật khẩu).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:PartTimeSV <no-reply@parttimesv.local>}
# Địa chỉ frontend dùng để tạo đường dẫn trong email
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}